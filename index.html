<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f4ef;
    --surface: #ffffff;
    --ink: #1a1a18;
    --muted: #7a7a72;
    --green-dark: #1a3d2b;
    --border: #e2ddd6;
    --radius: 14px;
    --badge: #1a1a18;
    --green-light:#4a8c60;
    --gold:       #c37b52;
    --cream:      #f5f0e8;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    padding: 48px 48px 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--gold); }

  .cart-btn {
    position: relative;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 12px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.2s;
  }
  .cart-btn:hover { background: var(--green-light); }

  .cart-count {
    background: var(--green-light);
    color: #fff;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    transition: transform 0.2s;
  }
  .cart-count.pop { transform: scale(1.4); }

  /* ── HERO TEXT ── */
  .hero {
    padding: 40px 48px 32px;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.6rem);
    font-weight: 500;
    line-height: 1.1;
    max-width: 520px;
  }
  .hero p {
    margin-top: 12px;
    color: var(--green-light);
    font-size: 1rem;
    font-weight: 300;
    max-width: 400px;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    padding: 0 48px 80px;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s, border-color 0.2s;
    user-select: none;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.10);
  }
  .card.selected {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--cream), 0 16px 40px rgba(0,0,0,0.10);
  }

  .card-check {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
    z-index: 2;
  }
  .card.selected .card-check {
    background: var(--gold);
    border-color: var(--gold);
  }
  .card-check svg { opacity: 0; transition: opacity 0.15s; }
  .card.selected .card-check svg { opacity: 1; }

  .card-img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    background: var(--cream);
  }

  /* placeholder image pattern */
  .card-img-placeholder {
  width: 100%;
  aspect-ratio: 4/3;
  overflow: hidden;
}

.card-img-placeholder img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

  .card-body {
    padding: 18px 20px 20px;
  }

  .card-tag {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--green-light);
    margin-bottom: 6px;
  }

  .card-title {
    font-family: 'DM Sans', serif;
    font-size: 1.15rem;
    font-weight: 500;
    line-height: 1.3;
  }

  .card-sub {
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.45;
  }

  /* ── FLOATING BAR ── */
  .float-bar {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--ink);
    color: #fff;
    border-radius: 60px;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 100;
    white-space: nowrap;
  }
  .float-bar.visible { transform: translateX(-50%) translateY(0); }

  .float-bar-text { font-size: 0.9rem; font-weight: 400; }
  .float-bar-text strong { font-weight: 700; }

  .float-bar-btn {
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 40px;
    padding: 10px 22px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .float-bar-btn:hover { opacity: 0.85; }

  /* ── MODAL ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,26,24,0.55);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 36px 36px 48px;
    width: 100%;
    max-width: 560px;
    transform: translateY(40px);
    transition: transform 0.35s cubic-bezier(0.34,1.2,0.64,1);
    max-height: 90vh;
    overflow-y: auto;
  }
  .overlay.open .modal { transform: translateY(0); }

  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 4px;
    margin: 0 auto 28px;
  }

  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .modal .modal-sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }

  .order-items {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .order-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .order-item:last-child { border-bottom: none; }
  .order-item-img { font-size: 1.4rem; }
  .order-item-name { font-weight: 500; flex: 1; }
  .order-item-price { color: var(--muted); }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-group label {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .form-group input, .form-group textarea {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--cream);
    outline: none;
    transition: border-color 0.2s;
    resize: none;
  }
  .form-group input:focus, .form-group textarea:focus {
    border-color: var(--green-dark);
  }
  .form-full { grid-column: 1 / -1; }

  .modal-send {
    width: 100%;
    margin-top: 20px;
    background: var(--green-dark);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }
  .modal-send:hover { opacity: 0.88; transform: scale(1.01); }

  .modal-cancel {
    width: 100%;
    margin-top: 10px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    padding: 8px;
  }
  .modal-cancel:hover { color: var(--ink); }

  @media (max-width: 600px) {
    header, .hero, .grid { padding-left: 20px; padding-right: 20px; }
    .form-row { grid-template-columns: 1fr; }
    .modal { padding: 28px 20px 40px; }
  }
</style>

  const grid = document.getElementById('productGrid');
  grid.innerHTML = products.map(p => `
    <div class="card ${selected.has(p.id) ? 'selected' : ''}" id="card-${p.id}" onclick="toggleProduct(${p.id})">
      <div class="card-check">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <polyline points="2,7 5.5,10.5 12,3.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="card-img-placeholder" style="background:${tagColor(p.tag)}"> 
       <img src="${p.img}" alt="${p.title}"> 
      </div>
      
      <div class="card-body">
        <div class="card-tag">${p.tag}</div>
        <div class="card-title">${p.title}</div>
        <div class="card-sub">${p.sub}</div>

      </div>
    </div>
  `).join('');
}

function tagColor(tag) {
  const map = {
    Meals: '#fff', Drinks: '#fff', Snacks: '#fff',
  };
  return map[tag] || '#fff';
}

function toggleProduct(id) {
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
  updateUI();
}

function updateUI() {
  renderGrid();
  const count = selected.size;
  document.getElementById('cartCount').textContent = count;
  document.getElementById('floatCount').textContent = count;

  const bar = document.getElementById('floatBar');
  if (count > 0) bar.classList.add('visible');
  else bar.classList.remove('visible');

  // pop animation on count badge
  const badge = document.getElementById('cartCount');
  badge.classList.add('pop');
  setTimeout(() => badge.classList.remove('pop'), 200);
}

function buildOrderItems() {
  const container = document.getElementById('orderItems');
  const items = products.filter(p => selected.has(p.id));
  container.innerHTML = items.map(p => `
    <div class="order-item">
      <span class="order-item-name">${p.title}</span>
    </div>
  `).join('');
}

function openModal() {
  if (selected.size === 0) return;
  buildOrderItems();
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

function sendOrder() {
  const fname = document.getElementById('fname').value.trim();
  const lname = document.getElementById('lname').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('message').value.trim();

  if (!fname || !email) {
    alert('Please enter your first name and email address.');
    return;
  }

  const items = products.filter(p => selected.has(p.id));
  const itemLines = items.map(p => `• ${p.title} — ${p.price}`).join('\n');

  const subject = `New Order from ${fname} ${lname}`;
  const body = [
    `Hello,`,
    ``,
    `You have received a new order:`,
    ``,
    `━━━━━━━━━━━━━━━━`,
    `CUSTOMER`,
    `Name: ${fname} ${lname}`,
    `Email: ${email}`,

    ``,
    `ITEMS ORDERED`,
    itemLines,
    ``,
    message ? `MESSAGE\n${message}` : null,
    `━━━━━━━━━━━━━━━━`,
  ].filter(l => l !== null).join('\n');

  const mailtoLink = `mailto:${YOUR_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailtoLink;
}

// Init
renderGrid();
</script>
</body>
</html>
